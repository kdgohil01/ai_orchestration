name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Deliberately self-hosted and manual: this project must never consume paid CI minutes.
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm test
      - run: npm run test:syntax
      - run: python -m py_compile burn_captions.py process_videos.py
